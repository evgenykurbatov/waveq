[workspace]
authors = ["Evgeny P. Kurbatov <evgenykurbatov@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "waveq"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
ijulia = { cmd = "jupyter console --kernel julia-1.12" }

[activation]
env = { PYTHON_JULIACALL_HANDLE_SIGNALS = "yes", JULIA_NUM_THREADS = "auto" }

[dependencies]
python = "3.13.*"
julia = ">=1.12.5,<1.13"
numpy = ">=2.5.0,<3"
matplotlib = ">=3.11.0,<4"

[pypi-dependencies]
juliacall = ">=0.9.35, <0.10"

[feature.dev.dependencies]
conda = ">=24.0.0"
jupyter_console = ">=6.6.3,<7"

[environments]
dev = { features = ["dev"] }
